nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

backend:
  replicaCount: 2
  homeSizeLimit: 1Gi
  image:
    repository: ""
    digest: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

frontend:
  replicaCount: 2
  image:
    repository: ""
    digest: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

obo:
  enabled: true
  replicaCount: 2
  image:
    repository: ""
    digest: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

authProxy:
  enabled: true
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    digest: ""
  adminGroupId: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

workloadIdentity:
  backendClientId: ""
  authClientId: ""
  oboClientId: ""
  backendServiceAccountName: kratos-agent-backend
  authServiceAccountName: kratos-agent-auth
  oboServiceAccountName: kratos-agent-obo

azure:
  tenantId: ""
  foundryEndpoint: ""
  foundryModelDeployment: ""
  cosmosDbEndpoint: ""
  blobStorageEndpoint: ""
  blobSkillsContainer: skills
  applicationInsightsResourceId: ""
  applicationInsightsWorkspaceId: ""

serviceNow:
  enabled: true
  instanceUrl: ""

observability:
  otlpEndpoint: ""
  serviceName: kratos-agent-service

auth:
  oboClientId: ""
  oboScope: ""
  oboServerName: graph-obo
  allowedClientAppIds: ""

secrets:
  existingSecret: kratos-agent-secrets
  backendSecret: kratos-agent-backend-secrets
  authSecret: kratos-agent-auth-secrets
  serviceNowClientIdKey: servicenow-client-id
  serviceNowClientSecretKey: servicenow-client-secret
  appInsightsConnectionStringKey: applicationinsights-connection-string
  oauthClientIdKey: oauth-client-id
  oauthClientSecretKey: oauth-client-secret
  oauthCookieSecretKey: oauth-cookie-secret
  keyVaultCsi:
    enabled: false
    vaultName: ""
    serviceNowClientIdObjectName: ""
    serviceNowClientSecretObjectName: ""
    appInsightsConnectionStringObjectName: ""
    oauthClientIdObjectName: ""
    oauthClientSecretObjectName: ""
    oauthCookieSecretObjectName: ""

ingress:
  enabled: true
  className: webapprouting.kubernetes.azure.com
  host: ""
  tlsSecretName: kratos-agent-tls
  keyVaultCertificateUri: ""
  clusterIssuer: ""
  letsEncrypt:
    enabled: false
    environment: production
    email: ""
    privateKeySecretName: kratos-agent-letsencrypt-account
  controllerNamespace: app-routing-system

autoscaling:
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75

networkPolicy:
  enabled: true
  dnsNamespace: kube-system
