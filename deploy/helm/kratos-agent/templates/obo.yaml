{{- if .Values.obo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kratos.fullname" . }}-obo
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
    app.kubernetes.io/component: obo
spec:
  replicas: {{ .Values.obo.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: obo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kratos.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: obo
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.workloadIdentity.oboServiceAccountName }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: obo
          image: {{ include "kratos.image" .Values.obo.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AZURE_TENANT_ID
              value: {{ required "azure.tenantId is required" .Values.azure.tenantId | quote }}
            - name: OBO_API_CLIENT_ID
              value: {{ required "auth.oboClientId is required when OBO is enabled" .Values.auth.oboClientId | quote }}
            - name: ALLOWED_CLIENT_APP_IDS
              value: {{ required "auth.allowedClientAppIds is required when OBO is enabled" .Values.auth.allowedClientAppIds | quote }}
            - name: ENVIRONMENT
              value: production
            - name: LOG_LEVEL
              value: INFO
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.obo.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/obo
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: home
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kratos.fullname" . }}-obo
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: obo
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
