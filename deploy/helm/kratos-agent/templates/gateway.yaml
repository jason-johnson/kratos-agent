{{- if .Values.gateway.enabled }}
{{- if not .Values.authProxy.enabled }}
{{- fail "authProxy.enabled must be true when gateway.enabled is true" }}
{{- end }}
{{- $host := required "gateway.host is required when gateway.enabled is true" .Values.gateway.host }}
{{- $dnsLabel := required "gateway.azureDnsLabel is required when gateway.enabled is true" .Values.gateway.azureDnsLabel }}
{{- $tlsSecret := required "gateway.tlsSecretName is required when gateway.enabled is true" .Values.gateway.tlsSecretName }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "kratos.fullname" . }}-gateway
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
  {{- with .Values.gateway.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ . | quote }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    annotations:
      service.beta.kubernetes.io/azure-dns-label-name: {{ $dnsLabel | quote }}
      service.beta.kubernetes.io/azure-load-balancer-tcp-idle-timeout: "30"
  listeners:
    - name: http
      hostname: {{ $host | quote }}
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: {{ $host | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $tlsSecret }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kratos.fullname" . }}-gateway-redirect
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "kratos.fullname" . }}-gateway
      sectionName: http
  hostnames: [{{ $host | quote }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kratos.fullname" . }}-gateway
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "kratos.fullname" . }}-gateway
      sectionName: https
  hostnames: [{{ $host | quote }}]
  rules:
    - backendRefs:
        - name: {{ include "kratos.fullname" . }}-auth
          port: 4180
{{- end }}
