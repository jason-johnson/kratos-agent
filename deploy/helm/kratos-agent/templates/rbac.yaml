apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kratos.fullname" . }}-inspector
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kratos.fullname" . }}-inspector
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workloadIdentity.backendServiceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kratos.fullname" . }}-inspector
