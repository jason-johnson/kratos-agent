{{- if .Values.authProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kratos.fullname" . }}-auth
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kratos.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: auth
        {{- if .Values.secrets.keyVaultCsi.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- if .Values.secrets.keyVaultCsi.enabled }}
      serviceAccountName: {{ .Values.workloadIdentity.authServiceAccountName }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: oauth2-proxy
          image: {{ include "kratos.image" .Values.authProxy.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://login.microsoftonline.com/{{ required "azure.tenantId is required" .Values.azure.tenantId }}/v2.0
            - --scope=openid profile email groups
            - --email-domain=*
            - --upstream=static://202
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-access-token=false
            - --skip-provider-button=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-refresh=30m
            - --cookie-expire=8h
          ports:
            - name: http
              containerPort: 4180
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ ternary .Values.secrets.authSecret .Values.secrets.existingSecret .Values.secrets.keyVaultCsi.enabled }}
                  key: {{ .Values.secrets.oauthClientIdKey }}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ ternary .Values.secrets.authSecret .Values.secrets.existingSecret .Values.secrets.keyVaultCsi.enabled }}
                  key: {{ .Values.secrets.oauthClientSecretKey }}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ ternary .Values.secrets.authSecret .Values.secrets.existingSecret .Values.secrets.keyVaultCsi.enabled }}
                  key: {{ .Values.secrets.oauthCookieSecretKey }}
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            {{- toYaml .Values.authProxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if .Values.secrets.keyVaultCsi.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          {{- end }}
      {{- if .Values.secrets.keyVaultCsi.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "kratos.fullname" . }}-auth
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kratos.fullname" . }}-auth
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: auth
  ports:
    - name: http
      port: 4180
      targetPort: http
{{- end }}
