apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workloadIdentity.backendServiceAccountName }}
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.backendClientId is required" .Values.workloadIdentity.backendClientId | quote }}
automountServiceAccountToken: true
{{- if .Values.obo.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workloadIdentity.oboServiceAccountName }}
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.oboClientId is required when OBO is enabled" .Values.workloadIdentity.oboClientId | quote }}
automountServiceAccountToken: true
{{- end }}
