{{- if .Values.secrets.keyVaultCsi.enabled }}
{{- $vaultName := required "secrets.keyVaultCsi.vaultName is required when Key Vault CSI is enabled" .Values.secrets.keyVaultCsi.vaultName }}
{{- $serviceNowClientIdObjectName := required "secrets.keyVaultCsi.serviceNowClientIdObjectName is required when Key Vault CSI is enabled" .Values.secrets.keyVaultCsi.serviceNowClientIdObjectName }}
{{- $serviceNowClientSecretObjectName := required "secrets.keyVaultCsi.serviceNowClientSecretObjectName is required when Key Vault CSI is enabled" .Values.secrets.keyVaultCsi.serviceNowClientSecretObjectName }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "kratos.fullname" . }}-backend
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.secrets.backendSecret }}
      type: Opaque
      data:
        - objectName: {{ $serviceNowClientIdObjectName }}
          key: {{ .Values.secrets.serviceNowClientIdKey }}
        - objectName: {{ $serviceNowClientSecretObjectName }}
          key: {{ .Values.secrets.serviceNowClientSecretKey }}
        {{- with .Values.secrets.keyVaultCsi.appInsightsConnectionStringObjectName }}
        - objectName: {{ . }}
          key: {{ $.Values.secrets.appInsightsConnectionStringKey }}
        {{- end }}
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "workloadIdentity.backendClientId is required when Key Vault CSI is enabled" .Values.workloadIdentity.backendClientId | quote }}
    keyvaultName: {{ $vaultName | quote }}
    tenantId: {{ required "azure.tenantId is required when Key Vault CSI is enabled" .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ $serviceNowClientIdObjectName }}
          objectType: secret
        - |
          objectName: {{ $serviceNowClientSecretObjectName }}
          objectType: secret
        {{- with .Values.secrets.keyVaultCsi.appInsightsConnectionStringObjectName }}
        - |
          objectName: {{ . }}
          objectType: secret
        {{- end }}
{{- if .Values.authProxy.enabled }}
---
{{- $oauthClientIdObjectName := required "secrets.keyVaultCsi.oauthClientIdObjectName is required when auth proxy and Key Vault CSI are enabled" .Values.secrets.keyVaultCsi.oauthClientIdObjectName }}
{{- $oauthClientSecretObjectName := required "secrets.keyVaultCsi.oauthClientSecretObjectName is required when auth proxy and Key Vault CSI are enabled" .Values.secrets.keyVaultCsi.oauthClientSecretObjectName }}
{{- $oauthCookieSecretObjectName := required "secrets.keyVaultCsi.oauthCookieSecretObjectName is required when auth proxy and Key Vault CSI are enabled" .Values.secrets.keyVaultCsi.oauthCookieSecretObjectName }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "kratos.fullname" . }}-auth
  labels:
    {{- include "kratos.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.secrets.authSecret }}
      type: Opaque
      data:
        - objectName: {{ $oauthClientIdObjectName }}
          key: {{ .Values.secrets.oauthClientIdKey }}
        - objectName: {{ $oauthClientSecretObjectName }}
          key: {{ .Values.secrets.oauthClientSecretKey }}
        - objectName: {{ $oauthCookieSecretObjectName }}
          key: {{ .Values.secrets.oauthCookieSecretKey }}
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "workloadIdentity.authClientId is required when Key Vault CSI is enabled" .Values.workloadIdentity.authClientId | quote }}
    keyvaultName: {{ $vaultName | quote }}
    tenantId: {{ required "azure.tenantId is required when Key Vault CSI is enabled" .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ $oauthClientIdObjectName }}
          objectType: secret
        - |
          objectName: {{ $oauthClientSecretObjectName }}
          objectType: secret
        - |
          objectName: {{ $oauthCookieSecretObjectName }}
          objectType: secret
{{- end }}
{{- end }}
