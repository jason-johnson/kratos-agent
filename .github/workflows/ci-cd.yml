name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PRIVATE_PYPI_INDEX_URL: ${{ secrets.PRIVATE_PYPI_INDEX_URL }}
  PRIVATE_NPMRC: ${{ secrets.PRIVATE_NPMRC }}

jobs:
  # ─── Stage 1: Lint & Static Analysis ───
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: src/backend
        run: |
          test -n "$PRIVATE_PYPI_INDEX_URL" || { echo "::error::PRIVATE_PYPI_INDEX_URL is required"; exit 1; }
          export PIP_INDEX_URL="$PRIVATE_PYPI_INDEX_URL"
          pip install -e ".[dev]"

      - name: Run Ruff (lint + format check)
        working-directory: src/backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run MyPy (type checking)
        working-directory: src/backend
        run: mypy app/ --ignore-missing-imports

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: |
          test -n "$PRIVATE_NPMRC" || { echo "::error::PRIVATE_NPMRC is required"; exit 1; }
          printf '%s' "$PRIVATE_NPMRC" > "$RUNNER_TEMP/.npmrc"
          chmod 0600 "$RUNNER_TEMP/.npmrc"
          npm ci --userconfig "$RUNNER_TEMP/.npmrc"

      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint

  # ─── Stage 2: Unit Tests ───
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: src/backend
        run: |
          test -n "$PRIVATE_PYPI_INDEX_URL" || { echo "::error::PRIVATE_PYPI_INDEX_URL is required"; exit 1; }
          PIP_INDEX_URL="$PRIVATE_PYPI_INDEX_URL" pip install -e ".[dev]"

      - name: Run tests with coverage
        working-directory: src/backend
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: src/backend/coverage.xml

  # ─── Stage 3: Build ───
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure private package feeds
        run: |
          test -n "$PRIVATE_PYPI_INDEX_URL" || { echo "::error::PRIVATE_PYPI_INDEX_URL is required"; exit 1; }
          test -n "$PRIVATE_NPMRC" || { echo "::error::PRIVATE_NPMRC is required"; exit 1; }
          printf '%s' "$PRIVATE_NPMRC" > "$RUNNER_TEMP/.npmrc"
          chmod 0600 "$RUNNER_TEMP/.npmrc"

      - name: Build AKS backend image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --secret id=pip_index_url,env=PRIVATE_PYPI_INDEX_URL \
            --secret id=npmrc,src="$RUNNER_TEMP/.npmrc" \
            -f src/backend/Dockerfile.aks \
            -t kratos-agent-service:${{ github.sha }} .

      - name: Build AKS OBO image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --secret id=pip_index_url,env=PRIVATE_PYPI_INDEX_URL \
            -f src/obo-mcp-server/Dockerfile.aks \
            -t kratos-obo-mcp-server:${{ github.sha }} src/obo-mcp-server

      - name: Build AKS frontend image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --secret id=npmrc,src="$RUNNER_TEMP/.npmrc" \
            -f src/frontend/Dockerfile \
            -t kratos-frontend:${{ github.sha }} src/frontend

      - name: Smoke-test AKS images
        run: |
          docker run --rm kratos-agent-service:${{ github.sha }} python -c "import app.main"
          docker run --rm kratos-obo-mcp-server:${{ github.sha }} python -c "import server"
          container_id="$(docker run -d -p 127.0.0.1::8080 \
            -e SKIP_RUNTIME_CONFIG_WRITE=true kratos-frontend:${{ github.sha }})"
          trap 'docker rm -f "$container_id"' EXIT
          port="$(docker port "$container_id" 8080/tcp | sed 's/.*://')"
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:${port}/healthz"; then break; fi
            if [ "$attempt" -eq 20 ]; then docker logs "$container_id"; exit 1; fi
            sleep 1
          done

      - name: Scan AKS images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kratos-agent-service:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan AKS OBO image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kratos-obo-mcp-server:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan AKS frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kratos-frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan deployment configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy/helm/kratos-agent
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Set up Helm
        uses: azure/setup-helm@b7246b12e77f7134dc2d460a3d5bad15bbe29390 # v4.1.0

      - name: Validate Helm chart
        run: |
          helm lint deploy/helm/kratos-agent -f deploy/helm/kratos-agent/values-ci.yaml
          helm template validation deploy/helm/kratos-agent \
            --namespace kratos-agent \
            -f deploy/helm/kratos-agent/values-ci.yaml > "$RUNNER_TEMP/kratos-agent.yaml"

      # Build frontend
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci --userconfig "$RUNNER_TEMP/.npmrc"

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: src/frontend/out
