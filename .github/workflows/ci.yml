name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PRIVATE_PYPI_INDEX_URL: ${{ secrets.PRIVATE_PYPI_INDEX_URL }}
  PRIVATE_NPMRC: ${{ secrets.PRIVATE_NPMRC }}

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          test -n "$PRIVATE_PYPI_INDEX_URL" || { echo "::error::PRIVATE_PYPI_INDEX_URL is required"; exit 1; }
          PIP_INDEX_URL="$PRIVATE_PYPI_INDEX_URL" pip install --no-cache-dir ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Format check (ruff)
        run: ruff format --check app/ tests/

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports

      - name: Tests
        run: pytest tests/ -v --tb=short

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: |
          test -n "$PRIVATE_NPMRC" || { echo "::error::PRIVATE_NPMRC is required"; exit 1; }
          printf '%s' "$PRIVATE_NPMRC" > "$RUNNER_TEMP/.npmrc"
          chmod 0600 "$RUNNER_TEMP/.npmrc"
          npm ci --userconfig "$RUNNER_TEMP/.npmrc"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  bicep-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
