name: Provision AKS infrastructure

on:
  workflow_dispatch:
    inputs:
      deploy_obo:
        description: "Provision the optional Graph OBO identity and Entra applications"
        type: boolean
        default: false
      publish_images:
        description: "Build, smoke-test, and push the backend, frontend, and OBO images"
        type: boolean
        default: false
      publish_platform_images:
        description: "Scan and mirror the pinned cert-manager images"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-ktaks
  cancel-in-progress: false

jobs:
  provision:
    name: Provision ktaks
    runs-on: ubuntu-latest
    environment: ktaks
    env:
      AZURE_ENV_NAME: ktaks
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AKS_OPERATOR_PRINCIPAL_ID: ${{ secrets.AKS_OPERATOR_PRINCIPAL_ID }}
      KRATOS_PUBLIC_HOST: ${{ secrets.KRATOS_PUBLIC_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check required credentials
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          missing=()
          [ -n "$AZURE_CLIENT_ID" ] || missing+=(AZURE_CLIENT_ID)
          [ -n "$AZURE_TENANT_ID" ] || missing+=(AZURE_TENANT_ID)
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=(AZURE_SUBSCRIPTION_ID)
          [ -n "$AZURE_LOCATION" ] || missing+=(AZURE_LOCATION)
          [ -n "$AKS_OPERATOR_PRINCIPAL_ID" ] || missing+=(AKS_OPERATOR_PRINCIPAL_ID)
          [ -n "$KRATOS_PUBLIC_HOST" ] || missing+=(KRATOS_PUBLIC_HOST)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing ktaks environment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install azd
        uses: Azure/setup-azd@634ad924cf8baef2257898ba5663be8d19f15aca # v2.3.0

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to azd
        run: |
          azd auth login \
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}" \
            --federated-credential-provider github

      - name: Configure azd environment
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          DEPLOY_OBO: ${{ inputs.deploy_obo && 'true' || 'false' }}
        run: |
          azd env select "$AZURE_ENV_NAME" 2>/dev/null || \
            azd env new "$AZURE_ENV_NAME" \
              --location "$AZURE_LOCATION" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --no-prompt

          principal_id="$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv)"
          test -n "$principal_id"

          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_PRINCIPAL_ID "$principal_id"
          azd env set AKS_NAMESPACE kratos-agent
          azd env set AKS_OPERATOR_PRINCIPAL_ID "$AKS_OPERATOR_PRINCIPAL_ID"
          azd env set AUTH_REDIRECT_URI "https://${KRATOS_PUBLIC_HOST}/oauth2/callback"
          azd env set DEPLOY_OBO "$DEPLOY_OBO"
          azd env set FOUNDRY_MODEL_CAPACITY 250

      - name: Start existing AKS cluster
        run: |
          resource_group="rg-${AZURE_ENV_NAME}"
          cluster_name="$(
            az aks list \
              --resource-group "$resource_group" \
              --query '[0].name' \
              --output tsv
          )"

          if [ -z "$cluster_name" ]; then
            exit 0
          fi

          power_state="$(
            az aks show \
              --resource-group "$resource_group" \
              --name "$cluster_name" \
              --query powerState.code \
              --output tsv
          )"

          case "$power_state" in
            Running)
              ;;
            Stopped)
              az aks start \
                --resource-group "$resource_group" \
                --name "$cluster_name" \
                --only-show-errors \
                --output none
              ;;
            *)
              echo "::error::AKS cluster cannot be provisioned while its power state is '$power_state'."
              exit 1
              ;;
          esac

      - name: Provision infrastructure
        run: azd provision --no-prompt

      - name: Verify private package sources
        if: inputs.publish_images
        run: python .github/scripts/check-package-sources.py

      - name: Refresh Azure sign-in for image publication
        if: inputs.publish_images || inputs.publish_platform_images
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure private package feeds
        if: inputs.publish_images
        run: |
          ado_token="$(
            az account get-access-token \
              --resource 499b84ac-1321-427f-aa17-267ca6975798 \
              --query accessToken \
              --output tsv
          )"
          test -n "$ado_token"
          echo "::add-mask::$ado_token"

          python_index="https://azure:${ado_token}@pkgs.dev.azure.com/jasojohnson-mcap2/_packaging/PythonFeed/pypi/simple/"
          echo "::add-mask::$python_index"
          printf '%s' "$python_index" > "$RUNNER_TEMP/pip-index-url"
          chmod 0600 "$RUNNER_TEMP/pip-index-url"

          {
            echo "registry=https://ms-feed-12.pkgs.visualstudio.com/1es-public/_packaging/npm-public/npm/registry/"
            echo "always-auth=false"
          } > "$RUNNER_TEMP/.npmrc"
          chmod 0600 "$RUNNER_TEMP/.npmrc"

      - name: Build and smoke-test images
        if: inputs.publish_images
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --secret id=pip_index_url,src="$RUNNER_TEMP/pip-index-url" \
            --secret id=npmrc,src="$RUNNER_TEMP/.npmrc" \
            -f src/backend/Dockerfile.aks \
            -t kratos-agent-service:validation .

          docker build \
            --secret id=npmrc,src="$RUNNER_TEMP/.npmrc" \
            -f src/frontend/Dockerfile \
            -t kratos-frontend:validation \
            src/frontend

          docker build \
            --secret id=pip_index_url,src="$RUNNER_TEMP/pip-index-url" \
            -f src/obo-mcp-server/Dockerfile.aks \
            -t kratos-obo-mcp-server:validation \
            src/obo-mcp-server

          docker run --rm kratos-agent-service:validation python -c "import app.main"
          docker run --rm kratos-obo-mcp-server:validation python -c "import server"

          container_id="$(
            docker run -d -p 127.0.0.1::8080 \
              -e SKIP_RUNTIME_CONFIG_WRITE=true \
              kratos-frontend:validation
          )"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || :' EXIT
          port="$(docker port "$container_id" 8080/tcp | sed 's/.*://')"
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:${port}/healthz" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

      - name: Scan backend image
        if: inputs.publish_images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kratos-agent-service:validation
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        if: inputs.publish_images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kratos-frontend:validation
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan OBO image
        if: inputs.publish_images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kratos-obo-mcp-server:validation
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan cert-manager controller image
        if: inputs.publish_platform_images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/jetstack/cert-manager-controller@sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan cert-manager webhook image
        if: inputs.publish_platform_images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/jetstack/cert-manager-webhook@sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan cert-manager CA injector image
        if: inputs.publish_platform_images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/jetstack/cert-manager-cainjector@sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan cert-manager ACME solver image
        if: inputs.publish_platform_images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/jetstack/cert-manager-acmesolver@sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan cert-manager startup API check image
        if: inputs.publish_platform_images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/jetstack/cert-manager-startupapicheck@sha256:1c519d4afca1413d1e4ccd78bdc756184418ab55a34569a3b3de39d32f9974e1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push immutable image versions
        if: inputs.publish_images
        run: |
          registry_name="$(
            az acr list \
              --resource-group "rg-${AZURE_ENV_NAME}" \
              --query '[0].name' \
              --output tsv
          )"
          registry="$(
            az acr show \
              --resource-group "rg-${AZURE_ENV_NAME}" \
              --name "$registry_name" \
              --query loginServer \
              --output tsv
          )"
          test -n "$registry_name"
          test -n "$registry"
          echo "::add-mask::$registry"

          az acr login --name "$registry_name"

          docker tag kratos-agent-service:validation "$registry/kratos-agent-service:${GITHUB_SHA}"
          docker tag kratos-frontend:validation "$registry/kratos-frontend:${GITHUB_SHA}"
          docker tag kratos-obo-mcp-server:validation "$registry/kratos-obo-mcp-server:${GITHUB_SHA}"

          push_with_retry() {
            image="$1"
            for attempt in $(seq 1 12); do
              if docker push "$image"; then
                return 0
              fi
              if [ "$attempt" -eq 12 ]; then
                return 1
              fi
              echo "ACR authorization is still propagating; retrying image push."
              sleep 10
              az acr login --name "$registry_name"
            done
          }

          push_with_retry "$registry/kratos-agent-service:${GITHUB_SHA}"
          push_with_retry "$registry/kratos-frontend:${GITHUB_SHA}"
          push_with_retry "$registry/kratos-obo-mcp-server:${GITHUB_SHA}"

      - name: Mirror cert-manager images
        if: inputs.publish_platform_images
        run: |
          registry_name="$(
            az acr list \
              --resource-group "rg-${AZURE_ENV_NAME}" \
              --query '[0].name' \
              --output tsv
          )"
          test -n "$registry_name"

          import_image() {
            source="$1"
            target="$2"
            az acr import \
              --name "$registry_name" \
              --source "$source" \
              --image "$target" \
              --force \
              --only-show-errors \
              --output none
          }

          import_image \
            quay.io/jetstack/cert-manager-controller@sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc \
            platform/cert-manager-controller:v1.21.3
          import_image \
            quay.io/jetstack/cert-manager-webhook@sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458 \
            platform/cert-manager-webhook:v1.21.3
          import_image \
            quay.io/jetstack/cert-manager-cainjector@sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f \
            platform/cert-manager-cainjector:v1.21.3
          import_image \
            quay.io/jetstack/cert-manager-acmesolver@sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7 \
            platform/cert-manager-acmesolver:v1.21.3
          import_image \
            quay.io/jetstack/cert-manager-startupapicheck@sha256:1c519d4afca1413d1e4ccd78bdc756184418ab55a34569a3b3de39d32f9974e1 \
            platform/cert-manager-startupapicheck:v1.21.3

      - name: Summarize
        if: always()
        run: |
          {
            echo "### AKS infrastructure provisioning"
            echo ""
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`ktaks\` |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| OBO requested | \`${{ inputs.deploy_obo }}\` |"
            echo "| Images requested | \`${{ inputs.publish_images }}\` |"
            echo "| Platform images requested | \`${{ inputs.publish_platform_images }}\` |"
            echo ""
            echo "This workflow does not install Helm, change DNS or TLS, create application secrets, or run live acceptance tests."
          } >> "$GITHUB_STEP_SUMMARY"
